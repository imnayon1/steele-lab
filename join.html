<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Lab — Steele Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/"><em>Steele</em> Lab</a>
    <nav class="primary">
      <a href="/">Home</a>
      <a href="/research.html">Research</a>
      <a href="/people.html">People</a>
      <a href="/publications.html">Publications</a>
      <a href="/join.html" class="is-active">Join the lab</a>
    </nav>
  </div>
</header>

<section class="tight">
  <div class="wrap">
    <h1>Join the lab</h1>
  </div>
</section>

<section class="tight">
  <div class="wrap">
    <div class="row" style="grid-template-columns:1fr; border-top:none; padding-top:0;">
      <h3 id="postdoc-title"></h3>
      <p id="postdoc-text"></p>
    </div>
    <div class="row" style="grid-template-columns:1fr;">
      <h3 id="grad-title"></h3>
      <p id="grad-text"></p>
      <ul id="grad-fellowships"></ul>
    </div>
    <div class="row" style="grid-template-columns:1fr;">
      <h3 id="undergrad-title"></h3>
      <p id="undergrad-text"></p>
    </div>
  </div>
</section>

<section class="tight">
  <div class="wrap">
    <div class="callout contact">
      <h2>Get in touch</h2>
      <dl>
        <dt>Email</dt><dd><a data-email href="#"></a></dd>
        <dt>Phone</dt><dd data-phone></dd>
        <dt>Office</dt><dd data-office></dd>
      </dl>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap contact">
    <p><span data-lab-name></span> · <span data-department></span>, <span data-university></span></p>
  </div>
</footer>

<script src="/js/main.js"></script>
<script>
  renderSettings();
  renderJoin();
</script>
</body>
</html>
