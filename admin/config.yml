backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

site_url: https://example.netlify.app
display_url: https://example.netlify.app

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "Site Settings"
        name: "settings"
        fields:
          - { label: "Lab name", name: "labName", widget: "string" }
          - { label: "PI name", name: "piName", widget: "string" }
          - { label: "PI title", name: "piTitle", widget: "string" }
          - { label: "Department", name: "department", widget: "string" }
          - { label: "University", name: "university", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Office", name: "office", widget: "string" }

  - name: "home"
    label: "Home Page"
    files:
      - file: "content/home.json"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Small line above headline", name: "heroKicker", widget: "string" }
          - { label: "Headline", name: "heroHeadline", widget: "string" }
          - { label: "Intro paragraph", name: "heroText", widget: "text" }
          - label: "What we study (3 short highlights)"
            name: "highlights"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "\"Join the lab\" headline", name: "joinHeadline", widget: "string" }
          - { label: "\"Join the lab\" text", name: "joinText", widget: "text" }

  - name: "research"
    label: "Research Page"
    files:
      - file: "content/research.json"
        label: "Research Page"
        name: "research"
        fields:
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - { label: "\"Two strategies\" heading", name: "strategiesTitle", widget: "string" }
          - { label: "\"Two strategies\" text", name: "strategiesText", widget: "text" }
          - label: "Current research projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Project title", name: "title", widget: "string" }
              - { label: "Description", name: "text", widget: "text" }
          - { label: "Model system heading", name: "modelSystemTitle", widget: "string" }
          - { label: "Model system text", name: "modelSystemText", widget: "text" }

  - name: "people"
    label: "People Page"
    files:
      - file: "content/people.json"
        label: "People Page"
        name: "people"
        fields:
          - label: "Principal Investigator"
            name: "pi"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Education", name: "education", widget: "text" }
              - { label: "Interests", name: "interests", widget: "text" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Lab members"
            name: "members"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role (e.g. M.Sc. Student, Postdoctoral Researcher)", name: "role", widget: "string" }
              - { label: "Year (e.g. 2024 - Present)", name: "year", widget: "string", required: false }
              - { label: "Education", name: "education", widget: "string", required: false }
              - { label: "Interests", name: "interests", widget: "text", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }

  - name: "publications"
    label: "Publications"
    files:
      - file: "content/publications.json"
        label: "Publications"
        name: "publications"
        fields:
          - label: "Publication list"
            name: "publications"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Journal", name: "journal", widget: "string" }
              - { label: "Details (volume:pages)", name: "details", widget: "string", required: false }
              - { label: "DOI (just the code, e.g. 10.1128/mBio.01630-17)", name: "doi", widget: "string", required: false }
              - { label: "Note (e.g. undergraduate co-author)", name: "note", widget: "string", required: false }

  - name: "join"
    label: "Join the Lab Page"
    files:
      - file: "content/join.json"
        label: "Join the Lab Page"
        name: "join"
        fields:
          - { label: "Postdoc heading", name: "postdocTitle", widget: "string" }
          - { label: "Postdoc text", name: "postdocText", widget: "text" }
          - { label: "Grad student heading", name: "gradTitle", widget: "string" }
          - { label: "Grad student text", name: "gradText", widget: "text" }
          - label: "Fellowship links"
            name: "gradFellowships"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Undergrad heading", name: "undergradTitle", widget: "string" }
          - { label: "Undergrad text", name: "undergradText", widget: "text" }
